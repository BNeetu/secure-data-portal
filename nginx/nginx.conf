# ═══════════════════════════════════════════════════════════════
#  Secure Data Portal — nginx reverse proxy configuration
#
#  This provides the SECOND layer of IP restriction (the first is
#  the FastAPI IPAllowlistMiddleware in app/core/ip_allowlist.py).
#  Traffic from disallowed IPs is rejected here before it ever
#  reaches the Python process.
#
#  USAGE:
#    1. Replace YOUR_OFFICE_IP_HERE below with the real IP you'll
#       provide later (e.g. 203.0.113.42).
#    2. Replace YOUR_DOMAIN_HERE with your actual domain, or use
#       the server's IP if you don't have a domain yet.
#    3. Point ssl_certificate / ssl_certificate_key at real cert
#       files (e.g. from Let's Encrypt / certbot).
#    4. Copy this file to /etc/nginx/sites-available/, symlink to
#       sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`
# ═══════════════════════════════════════════════════════════════

# ── IP Allowlist (edit this block when the real office IP is known) ──
geo $allowed_ip {
    default 0;
    # YOUR_OFFICE_IP_HERE  1;     # <-- uncomment & set the real IP
    # 203.0.113.0/24 1;          # <-- or a whole office CIDR range
}

# ── Redirect all HTTP to HTTPS ──
server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;

    # ── TLS ──
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── IP allowlist enforcement (layer 1 of 2) ──
    # NOTE: /health is exempted so load balancers / uptime monitors still work.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        if ($allowed_ip = 0) {
            return 403;
        }
        # Forward the real client IP so the FastAPI middleware's layer-2
        # check (and audit log) records the correct origin.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # ── Frontend static files ──
        root /var/www/secure-data-portal/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # ── API routes → FastAPI backend ──
    location ~ ^/(auth|data|audit)/ {
        if ($allowed_ip = 0) {
            return 403;
        }
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8000;
    }

    # ── WebSocket (live dashboard updates) ──
    location /data/ws/live {
        if ($allowed_ip = 0) {
            return 403;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # keep long-lived WS connections open
    }

    client_max_body_size 30M; # allow Excel uploads up to MAX_UPLOAD_SIZE_MB + margin
}
